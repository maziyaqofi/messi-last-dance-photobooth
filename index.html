<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth - Messi</title>

    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>

    <main class="photobooth">

        <!-- LEFT: CAMERA + FRAME -->
        <section class="camera-section">

            <div class="camera-stage">

                <!-- Webcam -->
                <video
                    id="camera"
                    autoplay
                    playsinline>
                </video>

                <!-- Messi sticker triggered by Peace gesture -->
                <img
                    id="messiPeaceSticker"
                    src="assets/MessiPeace.png"
                    alt=""
                    class="gesture-sticker"
                >

                <img
                    id="messiPointSticker"
                    src="assets/MessiPoint.png"
                    alt=""
                    class="gesture-sticker"
                >

                <img
                    id="messiPose3Sticker"
                    src="assets/Pose3.png"
                    alt=""
                    class="gesture-sticker"
                >

                <!-- Loading / error message -->
                <div class="camera-message" id="cameraMessage">
                    Starting Camera...
                </div>

                <div class="countdown" id="countdown"></div>

                <div class="flash" id="flash"></div>
                <canvas id="captureCanvas"></canvas>

                <!-- Messi frame overlay -->
                <img
                    src="assets/mainframe.png"
                    class="frame-overlay"
                    alt="Messi's Last Dance Frame"
                >

            </div>

        </section>


        <!-- RIGHT: POSE PANEL -->
        <aside class="pose-panel">

            <div class="pose-list">

                <div class="photo-slot" id="photoSlot1">
                    <span>1</span>
                </div>

                <div class="photo-slot" id="photoSlot2">
                    <span>2</span>
                </div>

                <div class="photo-slot" id="photoSlot3">
                    <span>3</span>
                </div>

                <div class="photo-slot" id="photoSlot4">
                    <span>4</span>
                </div>

            </div>

            <div class="controls">

                <button class="control-button">
                    <span>3s</span>
                </button>

                <button class="capture-button" id="captureButton">
                    📷
                </button>

                <button class="control-button">
                    🖼️
                </button>

            </div>

        </aside>

    </main>

    <!-- =========================
        PHOTO RESULTS
    ========================= -->

    <section class="result-screen" id="resultScreen">

        <div class="result-container">

            <div class="result-header">
                <p class="result-label">MESSI'S LAST DANCE</p>

                <h1>Your Moments</h1>

                <p class="result-description">
                    Four shots. One unforgettable moment.
                </p>
            </div>


            <div class="result-grid">

                <div class="result-photo" id="resultPhoto1"></div>

                <div class="result-photo" id="resultPhoto2"></div>

                <div class="result-photo" id="resultPhoto3"></div>

                <div class="result-photo" id="resultPhoto4"></div>

            </div>


            <div class="result-actions">

                <button
                    class="back-button"
                    id="backButton"
                >
                    ← Back to Camera
                </button>


                <button
                    class="download-button"
                    id="downloadButton"
                >
                    Download Photos
                </button>

            </div>

        </div>

    </section>

    <audio
        id="backgroundMusic"
        src="assets/worldcup22.mp3"
        loop
        preload="auto">
    </audio>

    <script src="js/app.js"></script>
    <script type="module" src="js/gesture.js"></script>
</body>
</html>
